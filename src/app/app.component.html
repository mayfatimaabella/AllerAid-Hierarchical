<!-- STARTUP SCREEN-->
<div
  class="startup-screen"
  *ngIf="showStartupScreen"
>
  <div class="startup-content">

    <div class="startup-logo">
      <ion-icon name="medical-outline"></ion-icon>
    </div>

    <h1>AllerAid</h1>

    <p>Your allergy safety companion</p>

    <div class="startup-spinner">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <span class="startup-message">
      Loading your account...
    </span>

  </div>
</div>


<!-- SIDE MENU -->
<ion-menu side="start" menuId="first" contentId="main-content">

  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list>

      <!-- User/Patient Navigation -->
      <ng-container *ngIf="userRole === 'user'">

        <ion-item
          lines="none"
          [routerLink]="['/tabs/profile']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>

        <ion-item
          lines="none"
          [routerLink]="['/tabs/buddy']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="people-outline" slot="start"></ion-icon>
          <ion-label>Buddy</ion-label>
        </ion-item>

        <ion-item
          lines="none"
          [routerLink]="['/tabs/patients-doctor']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="medical-outline" slot="start"></ion-icon>
          <ion-label>Doctor</ion-label>
        </ion-item>

        <ion-item
          lines="none"
          [routerLink]="['/tabs/medication']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="medkit-outline" slot="start"></ion-icon>
          <ion-label>Medication</ion-label>
        </ion-item>

        <ion-item
          lines="none"
          [routerLink]="['/tabs/pollen-map']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="map-outline" slot="start"></ion-icon>
          <ion-label>Pollen Map</ion-label>
        </ion-item>

      </ng-container>


      <!-- Buddy Navigation -->
      <ng-container *ngIf="userRole === 'buddy'">

        <ion-item
          lines="none"
          [routerLink]="['/tabs/responder-dashboard']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="speedometer-outline" slot="start"></ion-icon>
          <ion-label>Dashboard</ion-label>
        </ion-item>

        <ion-item
          lines="none"
          [routerLink]="['/tabs/emergencies']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="warning-outline" slot="start"></ion-icon>
          <ion-label>Emergencies</ion-label>
        </ion-item>

        <ion-item
          lines="none"
          [routerLink]="['/tabs/buddy']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-label>Invitations</ion-label>
        </ion-item>

        <ion-item
          lines="none"
          [routerLink]="['/responder-map']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="map-outline" slot="start"></ion-icon>
          <ion-label>Emergency Map</ion-label>
        </ion-item>

        <ion-item
          lines="none"
          [routerLink]="['/tabs/profile']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>

      </ng-container>


      <!-- Doctor/Healthcare Navigation -->
      <ng-container *ngIf="userRole === 'doctor'">

        <ion-item
          lines="none"
          [routerLink]="['/tabs/doctor-dashboard']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="medical-outline" slot="start"></ion-icon>
          <ion-label>Dashboard</ion-label>
        </ion-item>

        <ion-item
          lines="none"
          [routerLink]="['/tabs/profile']"
          (click)="onMenuItemClick()"
        >
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>

      </ng-container>


      <!-- Logout -->
      <ion-item
        lines="none"
        (click)="logout()"
      >
        <ion-icon
          name="log-out-outline"
          slot="start"
          style="color: #ffffff"
        ></ion-icon>

        <ion-label>Logout</ion-label>
      </ion-item>

    </ion-list>
  </ion-content>

</ion-menu>


<!-- MAIN CONTENT -->
<ion-router-outlet id="main-content"></ion-router-outlet>
