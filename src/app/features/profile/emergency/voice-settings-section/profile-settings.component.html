<div class="voice-settings-section" *ngIf="audioInstructionsEnabled">
  <div class="voice-audio-settings">
    <div class="voice-heading">
      <div class="voice-heading-icon"><ion-icon name="volume-high-outline" aria-hidden="true"></ion-icon></div>
      <div>
        <h4>Voice settings</h4>
        <p>Customize how your emergency instructions sound when read aloud.</p>
      </div>
    </div>

    <div class="setting-item">
      <div class="setting-info">
        <label id="default-voice-label">Voice</label>
        <p>Choose the built-in speech voice.</p>
      </div>
      <ion-select aria-labelledby="default-voice-label" [(ngModel)]="profileVoiceFacade.audioSettings.defaultVoice"
                  (ionChange)="profileVoiceFacade.onAudioSettingChange()"
                  interface="popover" mode="ios" placeholder="Select voice">
        <ion-select-option value="female">Female</ion-select-option>
        <ion-select-option value="male">Male</ion-select-option>
      </ion-select>
    </div>

    <div class="setting-item">
      <div class="setting-info">
        <label id="speech-rate-label">Speech rate <span>{{ profileVoiceFacade.audioSettings.speechRate | number:'1.1-1' }}×</span></label>
        <p>Adjust how quickly the instructions are spoken.</p>
      </div>
      <ion-range aria-labelledby="speech-rate-label" [(ngModel)]="profileVoiceFacade.audioSettings.speechRate"
                 (ionChange)="profileVoiceFacade.onAudioSettingChange()"
                 min="0.5"
                 max="2.0"
                 step="0.1"
                 pin="true" snaps="false" color="primary">
        <ion-label slot="start">0.5×</ion-label>
        <ion-label slot="end">2×</ion-label>
      </ion-range>
    </div>
  </div>
</div>
