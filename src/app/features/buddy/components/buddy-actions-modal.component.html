<ng-container>
  <div class="buddy-modal-backdrop" (click)="close()">
    <section class="buddy-modal-content" role="dialog" aria-modal="true" aria-labelledby="buddy-actions-title" (click)="$event.stopPropagation()">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="modal-heading">
        <div class="buddy-avatar" aria-hidden="true">
          {{ buddy?.firstName?.charAt(0) || buddy?.buddyName?.charAt(0) || '?' }}{{ buddy?.lastName?.charAt(0) || '' }}
        </div>
        <div class="buddy-summary">
          <h2 id="buddy-actions-title">Buddy options</h2>
          <p>{{ buddy?.firstName || buddy?.buddyName || 'Selected buddy' }} {{ buddy?.lastName }}</p>
        </div>
        <ion-button class="close-button" fill="clear" aria-label="Close buddy options" (click)="close()">
          <ion-icon name="close-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </header>

      <ion-list lines="none" class="action-list">
        <ion-item button detail="false" class="action-item edit-action" (click)="editBuddy()">
          <span class="action-icon" slot="start"><ion-icon name="create-outline"></ion-icon></span>
          <ion-label>
            <h3>Edit contact</h3>
            <p>Update this buddy’s details</p>
          </ion-label>
          <ion-icon name="chevron-forward-outline" slot="end" class="action-chevron"></ion-icon>
        </ion-item>
        <ion-item button detail="false" class="action-item delete-action" (click)="deleteBuddy()">
          <span class="action-icon" slot="start"><ion-icon name="trash-outline"></ion-icon></span>
          <ion-label>
            <h3>Remove buddy</h3>
            <p>Remove them from your network</p>
          </ion-label>
          <ion-icon name="chevron-forward-outline" slot="end" class="action-chevron"></ion-icon>
        </ion-item>
      </ion-list>
    </section>
  </div>
</ng-container>
