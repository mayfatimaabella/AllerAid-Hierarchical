<ion-content [fullscreen]="true" class="login-page">
  <main class="page-shell">
    <section class="login-card" aria-labelledby="login-heading">
      <header class="welcome-copy">
        <p class="eyebrow">ALLERAID</p>
        <h1 id="login-heading">Welcome back</h1>
        <p>Sign in to stay connected to your care.</p>
      </header>

      <form (ngSubmit)="login()" novalidate>
        <div class="field-group">
          <ion-label for="login-email">Email address</ion-label>
          <ion-item lines="none" class="input-row" [class.input-invalid]="submitted && (!email || !isValidEmail())">
            <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
            <ion-input id="login-email" name="email" type="email" inputmode="email" autocomplete="email"
              placeholder="you@example.com" [(ngModel)]="email" (ionInput)="clearEmailError()"
              aria-describedby="email-error" required></ion-input>
          </ion-item>
          <ion-text color="danger" *ngIf="submitted && (!email || !isValidEmail())">
            <p class="field-error" id="email-error">
              <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
              {{ !email ? 'Email is required.' : 'Enter a valid email address.' }}
            </p>
          </ion-text>
        </div>

        <div class="field-group">
          <div class="label-row">
            <ion-label for="login-password">Password</ion-label>
            <button type="button" class="text-link forgot-link" (click)="openForgotPasswordModal()">Forgot password?</button>
          </div>
          <ion-item lines="none" class="input-row" [class.input-invalid]="submitted && !password">
            <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
            <ion-input id="login-password" name="password" [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password" placeholder="Enter your password" [(ngModel)]="password"
              (ionInput)="clearPasswordError()" aria-describedby="password-error" required></ion-input>
            <ion-button type="button" fill="clear" slot="end" class="visibility-toggle"
              (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" aria-hidden="true"></ion-icon>
            </ion-button>
          </ion-item>
          <ion-text color="danger" *ngIf="submitted && !password">
            <p class="field-error" id="password-error">
              <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
              Password is required.
            </p>
          </ion-text>
        </div>

        <ion-button type="submit" expand="block" class="login-button">
          Sign in
          <ion-icon slot="end" name="arrow-forward-outline" aria-hidden="true"></ion-icon>
        </ion-button>
      </form>

      <div class="signup-prompt">
        <span>New to AllerAid?</span>
        <a routerLink="/registration">Create an account</a>
      </div>
    </section>

    <p class="supporting-note">
      <ion-icon name="heart-outline" aria-hidden="true"></ion-icon>
      Your health, supported every step of the way.
    </p>
  </main>
</ion-content>
