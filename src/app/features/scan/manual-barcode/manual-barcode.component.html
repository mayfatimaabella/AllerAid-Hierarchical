<div class="manual-barcode-modal-backdrop" (click)="closeModal()">
  <div class="manual-barcode-modal-content" role="dialog" aria-modal="true" aria-labelledby="manual-barcode-title" (click)="$event.stopPropagation()">
    <div class="manual-modal-heading">
      <div class="manual-icon"><ion-icon name="barcode-outline"></ion-icon></div>
      <div>
        <h2 id="manual-barcode-title">Enter a barcode</h2>
        <p>Type the numbers printed below the product barcode.</p>
      </div>
    </div>

    <ion-item class="barcode-input-item">
      <ion-label position="stacked">Barcode number</ion-label>
      <ion-input [(ngModel)]="manualBarcode" inputmode="numeric" autocomplete="off" placeholder="e.g. 737628064502"></ion-input>
    </ion-item>

    <ion-button expand="block" id="searchBtn" (click)="onSubmit()">
      <ion-icon slot="start" name="search-outline"></ion-icon>
      Search Product
    </ion-button>
    
    <ion-button expand="block" fill="outline" (click)="closeModal()">
      Cancel
    </ion-button>
  </div>
</div>
